name: aminci
description: "Application desktop Windows de gestion et génération de tickets d'accès MikroTik (hotspot vouchers)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  bloc: ^9.2.0
  crypto: ^3.0.7
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.8
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^11.0.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  intl: ^0.20.2
  pdf: ^3.11.2
  printing: ^5.14.3
  sqflite_common_ffi: ^2.4.0+2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
